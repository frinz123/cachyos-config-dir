source = ~/.config/hypr/hyprlock-colors.conf

general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = true
    grace = 0
    disable_loading = true
}

background {
    monitor =
    path = /home/frinz/.cache/waypaper_current_bg
    color = $lock_bg
    blur_passes = 2
    blur_size = 5
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +'%H:%M')</b>"
    color = $lock_hour
    font_size = 140
    font_family = JetBrainsMono Nerd Font
    position = 100, -100
    halign = left
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:18000000] echo "<b>$(date +'%A, %-d %B')</b>"
    color = $lock_date
    font_size = 32
    font_family = JetBrainsMono Nerd Font
    position = 115, -310
    halign = left
    valign = top
}

# UPTIME
label {
    monitor =
    text = cmd[update:60000] echo "UP: $(uptime -p | sed 's/up //')"
    color = $lock_uptime
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 120, -375
    halign = left
    valign = top
}

# PROFILE
image {
    monitor =
    path = /home/frinz/.face
    size = 150
    border_size = 3
    border_color = $lock_input_border
    position = 0, 115
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =  Frinz
    color = $lock_user
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 0
    halign = center
    valign = center
}

# INPUT
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    outer_color = $lock_input_border
    inner_color = rgba(0, 0, 0, 0.4)
    font_color = $lock_input_text
    check_color = $lock_input_border
    fail_color = $lock_input_fail
    placeholder_text = Enter Password...
    hide_input = false
    rounding = 15
    position = 0, -80
    halign = center
    valign = center
}
