$terminal = kitty
$fileManager = thunar
$menu = wofi

$mainMod = SUPER

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu --show drun --show-icons
bind = $mainMod SHIFT, R, exec, $menu --show run --show-icons
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, period, exec, wofi-emoji
bind = $mainMod, B, exec, brave --ozone-platform-hint=auto --enable-features=WaylandWindowDecorations,VaapiVideoDecoder --canvas-oop-rasterization --enable-gpu-rasterization --process-per-site --renderer-process-limit=4 --disable-features=BraveRewards,BraveNews,BraveWallet,BraveVPN,BraveLeo,BraveAiChat
bind = $mainMod, N, exec, kitty -e nvim
bind = $mainMod, G, exec, brave --app-id=gdfaincndogidkdcdkhapmbffkckdkhn
bind = $mainMod, D, exec, vesktop --enable-low-end-device-mode --disable-renderer-backgrounding --js-flags="--max-old-space-size=256" --enable-features=UseOzonePlatform --ozone-platform=wayland
bind = $mainMod, T, exec, spotify
bind = $mainMod SHIFT, C, exec, mpv /dev/video0 --title="webcam" --profile=low-latency --untimed --no-osc --no-osd-bar
bind = CTRL SHIFT, Escape, exec, kitty -e btop
bind = $mainMod, Escape, exec, hyprctl reload && pkill waybar && waybar &
bind = $mainMod, comma, exec, kitty -e nvim ~/.config/hypr
bind = $mainMod CTRL, comma, exec, kitty -e nvim ~/.config/waybar
bind = $mainMod, W, exec, waypaper
bind = $mainMod CTRL, S, exec, spotify
bind = $mainMod, A, exec, swaync-client -t -sw

bind = $mainMod SHIFT, grave, submap, vm_mode
submap = vm_mode
bind = $mainMod SHIFT, grave, submap, reset
submap = reset

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u1
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u1
bind = $mainMod SHIFT, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Basically useless but i'm gonna keep it for funsies
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop thingies
bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume +5
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume -5
bindel = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && swayosd-client --input-volume mute-toggle
bindel = ,XF86MonBrightnessUp, exec, swayosd-client --brightness +5
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness -5

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
