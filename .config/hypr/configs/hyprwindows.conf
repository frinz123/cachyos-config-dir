source = ~/.config/hypr/colors.conf # needed for border colors

general {
    gaps_in = 5
    gaps_out = 5

    border_size = 3

    # HIJACKED BY FRINZ! LOLOLOLOL
    col.active_border = $active_border
    col.inactive_border = $inactive_border
   
    resize_on_border = true
    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 8
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1
    inactive_opacity = 1

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        new_optimizations = true

        vibrancy = 0.1696
    }
}

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

# Window rules that hyprland made for me :3

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

windowrule {
    name = webcam-style
    match:title = ^(webcam)$
    float = on
    size = 1000 560
    move = 100%-410 50
}

# Custom windowrules

windowrule {
    name = waypaper-menu
    match:class = ^(waypaper)$
    
    float = on
    size = 900 800
    center = 1

    rounding = 15
}

windowrule {
    name = cava-immaculate
    match:class = ^(cava)$

    opacity = 1 0.5
}

windowrule {
    name = welcome
    match:class =  ^(welcome)$

    opacity = 1.3

    float = on
    center = 1

    size = 800 500
}
