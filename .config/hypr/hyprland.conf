source = ~/.config/hypremoji/hypremoji.conf
source = ~/.config/hypr/configs/hyprbindings.conf
source = ~/.config/hypr/configs/hyprwindows.conf
source = ~/.config/hypr/configs/hypranimations.conf
source = ~/.config/hypr/configs/hyprmisc.conf

monitor=,preferred,auto,1

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = mako
exec-once = /usr/lib/pam_kwallet_init
exec-once = awww-daemon
exec-once = wal -R
exec-once = waybar
exec-once = killall battery-notify.sh; ~/.config/hypr/scripts/battery-notify.sh
exec-once = hyprctl setcursor Bibata-Modern-Classic 24
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = swayosd-server
exec-once = sleep 0.5 && kitty --class welcome -e sh -c "./.config/waybar/scripts/welcome.sh; exec fish --no-config"

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Classic
